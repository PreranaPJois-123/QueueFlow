map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's embedded DNS at request time, so a
    # restarted backend container (new IP) is picked up without reloading nginx
    # and nginx can start before the backend is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Same-origin API + WebSocket proxy: the browser only ever talks to this
    # port, so the backend, PostgreSQL and Redis never need public exposure.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /docs { proxy_pass $backend_upstream; }
    location = /openapi.json { proxy_pass $backend_upstream; }

    # SPA fallback — client-side router owns everything not matching a real file
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
