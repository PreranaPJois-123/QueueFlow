name: QueueFlow checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: queueflow_test
          POSTGRES_USER: queueflow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queueflow -d queueflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql://queueflow:ci-only-password@localhost:5432/queueflow_test
      TEST_DATABASE_URL: postgresql://queueflow:ci-only-password@localhost:5432/queueflow_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-only-key-not-used-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check app
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Migrations (upgrade, drift check, downgrade, re-upgrade)
        # Disposable CI database only; never run downgrade on production data.
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pytest -q
      - name: Retrieval evaluation (offline embedder)
        run: |
          python -m app.seed && python -m app.rag.ingest && python -m app.rag.evaluate
        env:
          ENV: development
          CORS_ORIGINS: http://localhost:8080
      - run: docker build -t queueflow-backend .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://app.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t queueflow-frontend .
  compose-e2e:
    # Full stack in Docker plus the browser walkthrough (e2e/run.mjs).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment
        run: |
          {
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "SEED_SAMPLE_DATA=true"
            echo "INITIAL_ADMIN_EMAIL=ci-admin@example.com"
            echo "INITIAL_ADMIN_NAME=CI Admin"
            echo "INITIAL_ADMIN_PASSWORD=Ci-Walkthrough-2026"
          } > .env
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8080/api/health
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: node e2e/run.mjs http://localhost:8080
        env:
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: Ci-Walkthrough-2026
      - if: failure()
        run: docker compose logs --no-color | tail -200
