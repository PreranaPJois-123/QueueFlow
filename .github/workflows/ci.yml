name: QueueFlow checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queueflow_test
          POSTGRES_USER: queueflow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queueflow -d queueflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql://queueflow:ci-only-password@localhost:5432/queueflow_test
      TEST_DATABASE_URL: postgresql://queueflow:ci-only-password@localhost:5432/queueflow_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-only-key-not-used-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip check
      - run: alembic upgrade head && alembic check
      # Disposable CI database only; never run downgrade on production data.
      - run: alembic downgrade base && alembic upgrade head
      - run: pytest -q
      - run: docker build -t queueflow-backend .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t queueflow-frontend .
