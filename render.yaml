services:
  - type: web
    name: queueflow-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: queueflow-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: SMART_ALERT_THRESHOLD
        value: "3"
      - key: DEFAULT_AVG_SERVICE_MINUTES
        value: "5"

  - type: web
    name: queueflow-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: queueflow-backend
          property: url

databases:
  - name: queueflow-db
    plan: free
    region: oregon
    databaseName: queueflow
    user: queueflow_user
