# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free plans preserve the existing budget; see docs/DEPLOYMENT.md for limits.
services:
  - type: keyvalue
    name: queueflow-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: queueflow-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: queueflow-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Explicit actual frontend origin; avoids reciprocal service dependencies.
      # Existing Blueprints require this value to be set in the backend service.
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"

  - type: web
    name: queueflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: queueflow-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: queueflow-db
    plan: free
    region: oregon
    databaseName: queueflow
    user: queueflow_user
    ipAllowList: []
